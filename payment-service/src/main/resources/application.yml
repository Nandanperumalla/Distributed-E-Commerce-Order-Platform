server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:platform}
    password: ${DB_PASSWORD:platform}
    hikari:
      maximum-pool-size: 10
      pool-name: payments-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: payment-service

app:
  gateway:
    # Deliberately slow. Raise this and watch order intake stay fast while the
    # payment topic backs up — that is the whole argument for the Kafka hop.
    latency-ms: ${GATEWAY_LATENCY_MS:800}
    decline-above-cents: ${GATEWAY_DECLINE_ABOVE_CENTS:500000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.demo.orderplatform: INFO

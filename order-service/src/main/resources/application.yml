server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:platform}
    password: ${DB_PASSWORD:platform}
    hikari:
      maximum-pool-size: 10
      pool-name: orders-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: order-service

app:
  catalog:
    base-url: ${INVENTORY_BASE_URL:http://localhost:8082}
    timeout-ms: 1500
  idempotency:
    ttl-hours: 24

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.demo.orderplatform: INFO
